<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Live digital clock and stopwatch built with HTML, CSS and JavaScript."
  >

  <title>Digital Clock & Stopwatch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Hero Section -->
    <section class="hero">

      <p class="eyebrow">
        JAVASCRIPT PROJECT
      </p>

      <h1>
        Digital Clock & Stopwatch
      </h1>

      <p class="subtitle">
        A simple, responsive time dashboard built with
        HTML, CSS and JavaScript.
      </p>

    </section>


    <!-- Dashboard -->
    <section class="dashboard">

      <!-- Digital Clock -->
      <article class="card clock-card">

        <div class="card-heading">

          <div>
            <span class="label">
              CURRENT TIME
            </span>

            <h2>
              Digital Clock
            </h2>
          </div>

          <span
            class="status-dot"
            aria-label="Clock running">
          </span>

        </div>


        <div
          id="clock"
          class="time-display"
          aria-live="polite">
          00:00:00
        </div>


        <p
          id="date"
          class="date-display">
          Loading date...
        </p>

      </article>


      <!-- Stopwatch -->
      <article class="card stopwatch-card">

        <div class="card-heading">

          <div>
            <span class="label">
              ELAPSED TIME
            </span>

            <h2>
              Stopwatch
            </h2>
          </div>

          <span
            id="stopwatchStatus"
            class="status-text">
            PAUSED
          </span>

        </div>


        <div
          id="stopwatch"
          class="time-display"
          aria-live="polite">
          00:00:00
        </div>


        <div class="controls">

          <button
            id="startBtn"
            class="btn primary">
            Start
          </button>

          <button
            id="pauseBtn"
            class="btn secondary">
            Pause
          </button>

          <button
            id="resetBtn"
            class="btn secondary">
            Reset
          </button>

        </div>

      </article>

    </section>


    <!-- Footer -->
    <footer>
      <p>
        Built with HTML5 • CSS3 • JavaScript
      </p>
    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
